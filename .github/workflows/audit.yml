name: Screen audit
# A real Pelican panel with this checkout of Simplify and the add-ons (main), example data, a fake Wings with a live
# console, and a browser that opens every screen, tab, menu and overlay on eight window sizes and measures cut-off
# text, scrolling pages, popups off the screen and the console's colours. Result on the branch audit-results-<branch>-<stand>.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Stands, comma separated (empty = all): d1920,d1440,laag1366,laag1100,d1100,hoog1280,tablet768,phone390,phone360'
        default: ''
      toolkit:
        description: 'Branch of Simplify-Toolkit'
        default: 'main'
      servermaker:
        description: 'Branch of Simplify-ServerMaker (none = without Server Maker)'
        default: 'main'
      simplify:
        description: 'Branch of Simplify to audit (empty = this checkout); the audit itself always comes from this checkout'
        default: ''
      section:
        description: 'Only one section (empty = everything): seasons, extras, layers, first, or compare (the overview measured, 8 servers)'
        default: ''
      legacy:
        description: 'A branch of PelicanSimplify to install instead of Simplify and the add-ons (with section compare)'
        default: ''
      legacy_brand:
        description: 'yes = a PelicanSimplify 0.7.0 appearance.json with a brand block before Simplify installs (its import migration)'
        default: ''
  push:
    branches: ['claude/project-thread-k01bn2']
    paths: ['tests/audit/**', '.github/workflows/audit.yml']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stands: ${{ steps.list.outputs.stands }}
    steps:
      - id: list
        run: echo "stands=$(python3 -c "import json;s='${{ inputs.only }}'.strip();print(json.dumps(s.split(',') if s else ['d1920','d1440','laag1366','laag1100','d1100','hoog1280','tablet768','phone390','phone360']))")" >> "$GITHUB_OUTPUT"
  # One job per stand, side by side; each pushes its screens to the branch audit-results-<branch>-<stand>.
  audit:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        stand: ${{ fromJson(needs.plan.outputs.stands) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PELICAN: '1.0.0-rc.2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: simplify
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican
        run: |
          git clone --quiet --depth 1 --branch "v$PELICAN" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '$PELICAN'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=false/; s#^APP_URL=.*#APP_URL=http://127.0.0.1:8001#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=sync\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force --seed
          php artisan storage:link || true
          yarn install --silent
          yarn build
      - name: Install Simplify (this checkout) and the add-ons (main)
        working-directory: panel
        run: |
          if [ -n "${{ inputs.legacy }}" ]; then
            git clone --quiet --depth 1 --branch "${{ inputs.legacy }}" https://github.com/jerajerajerajera/PelicanSimplify.git plugins/pelican-simplify
            echo "PelicanSimplify from branch ${{ inputs.legacy }} at $(git -C plugins/pelican-simplify rev-parse --short HEAD)"
            rm -rf plugins/pelican-simplify/.git
            php artisan p:plugin:install pelican-simplify
            php artisan p:plugin:list
            exit 0
          fi
          mkdir -p plugins/simplify
          if [ -n "${{ inputs.simplify }}" ]; then
            git clone --quiet --depth 1 --branch "${{ inputs.simplify }}" https://github.com/jerajerajerajera/Simplify.git simplify-src
            echo "Simplify from branch ${{ inputs.simplify }} at $(git -C simplify-src rev-parse --short HEAD)"
            tar -C simplify-src --exclude=.git --exclude=tests --exclude=.github -cf - . | tar -C plugins/simplify -xf - && rm -rf simplify-src
          else
            tar -C ../simplify --exclude=.git --exclude=tests --exclude=.github -cf - . | tar -C plugins/simplify -xf -
          fi
          if [ "${{ inputs.legacy_brand }}" = yes ]; then
            for dir in storage/app/private/simplify storage/app/simplify; do mkdir -p "$dir"; echo '{"brand":{"font":"serif","weight":800,"color_style":"gradient","color1":"#ff7a59","color2":"#8e6bd8","spacing":8,"uppercase":true,"logo_text":true}}' > "$dir/appearance.json"; done
            echo "PelicanSimplify 0.7.0 appearance.json written"
          fi
          php artisan p:plugin:install simplify
          if [ "${{ inputs.legacy_brand }}" = yes ]; then php artisan tinker --execute="echo json_encode(\\DB::table('simplify_settings')->where('key', 'like', 'brand_%')->pluck('value', 'key'));" || true; fi
          for pair in Simplify-Toolkit:simplify-toolkit Simplify-EggUpdates:simplify-eggupdates Simplify-Explain:simplify-explain Simplify-ServerMaker:simplify-servermaker Simplify-Hosting:simplify-hosting; do
            repo=${pair%%:*}; id=${pair##*:}
            if [ "$repo" = Simplify-ServerMaker ] && [ "${{ inputs.servermaker }}" = none ]; then echo "Server Maker left out"; continue; fi
            branch=main; [ "$repo" = Simplify-Toolkit ] && branch="${{ inputs.toolkit || 'main' }}"; [ "$repo" = Simplify-ServerMaker ] && branch="${{ inputs.servermaker || 'main' }}"
            git clone --quiet --depth 1 --branch "$branch" "https://github.com/jerajerajerajera/$repo.git" "plugins/$id"
            real=$(php -r "echo json_decode(file_get_contents('plugins/$id/plugin.json'), true)['id'];")
            if [ "$real" != "$id" ]; then mv "plugins/$id" "plugins/$real"; id=$real; fi
            rm -rf "plugins/$id/.git"
            php artisan p:plugin:install "$id"
          done
          # A plugin that is not Simplify, so Admin tools has an Other plugins group, as on a real panel.
          cp -r ../simplify/tests/audit/fake-plugin plugins/audit-directory && php artisan p:plugin:install audit-directory || echo "audit-directory did not install"
          php artisan p:plugin:list
      - name: Seed and start the panel and the fake Wings
        working-directory: panel
        run: |
          php ../simplify/tests/audit/seed.php 8090 ${{ inputs.section == 'compare' && '8' || '' }} > servers.json
          php ../simplify/tests/audit/urls.php > urls.json || echo "{}" > urls.json
          cat urls.json
          nohup node ../simplify/tests/audit/fake-minecraft.cjs --servers servers.json > minecraft.out 2>&1 &
          nohup node ../simplify/tests/audit/fake-wings.cjs --port 8090 --servers servers.json --log wings.log > wings.out 2>&1 &
          PHP_CLI_SERVER_WORKERS=8 nohup php artisan serve --host 127.0.0.1 --port 8001 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8001/login && break; sleep 1; done
          curl -sS http://127.0.0.1:8090/api/system
      - name: Open every screen
        run: |
          cd simplify/tests/audit
          npm init -y > /dev/null
          npm install --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          if [ "${{ inputs.section }}" = compare ]; then node compare.cjs --base http://127.0.0.1:8001 --out ../../../result --only ${{ matrix.stand }}; exit 0; fi
          node audit.cjs --base http://127.0.0.1:8001 --urls ../../../panel/urls.json --out ../../../result --only ${{ matrix.stand }} --section "${{ inputs.section }}" --servermaker "${{ inputs.servermaker }}"
      - if: always()
        name: Logs
        run: |
          tail -n 40 panel/wings.log || true
          grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 30 || true
      - name: Style verdict (fails the job when a UI rule is broken)
        if: inputs.section != 'compare'
        id: style
        continue-on-error: true
        run: set -o pipefail; python3 simplify/tests/audit/style-report.py result/result.json | tee result/style.md
      - if: always()
        name: Result to the audit-results branch
        run: |
          cd result
          git init -q -b results
          git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm "Audit ${{ github.sha }} ${{ matrix.stand }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "results:refs/heads/audit-results-$(echo "${{ inputs.legacy && format('legacy-{0}', inputs.legacy) || inputs.simplify || github.ref_name }}" | tr "/" "-")${{ inputs.section == 'compare' && '-compare' || '' }}${{ inputs.servermaker == 'none' && '-nosm' || '' }}-${{ matrix.stand }}"
      - name: Fail when the style verdict is red
        if: steps.style.outcome == 'failure'
        run: |
          echo "::error::UI rules broken, see style.md on the results branch"
          exit 1
