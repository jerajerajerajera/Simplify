name: Screen audit
# A real Pelican panel with this checkout of Simplify and the add-ons (main), example data, a fake Wings with a live
# console, and a browser that opens every screen, tab, menu and overlay on eight window sizes and measures cut-off
# text, scrolling pages, popups off the screen and the console's colours. Result on the branch audit-results, folder <branch>-<stand>.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Stands, comma separated (empty = all): d1920,d1440,laag1366,laag1100,d1100,hoog1280,tablet768,phone390,phone360'
        default: ''
      theme:
        description: 'dark or light (empty = both where a stand has both: d1440 and phone390); each theme is a job of its own'
        default: ''
      scope:
        description: 'all = every screen; changed = only the parts of the audit that the files changed since main can touch (tests/audit/parts.py). The full audit runs before every release.'
        default: 'all'
      parts:
        description: 'Parts of a round, comma separated (empty = all): overview, server, admin, host, seasons, create, extras, notify, klant. After a red run: the parts of the red screens.'
        default: ''
      toolkit:
        description: 'Branch of Simplify-Toolkit'
        default: 'main'
      servermaker:
        description: 'Branch of Simplify-ServerMaker (none = without Server Maker)'
        default: 'main'
      hosting:
        description: 'Branch of Simplify-Hosting'
        default: 'main'
      explain:
        description: 'Branch of Simplify-Explain'
        default: 'main'
      simplify:
        description: 'Branch of Simplify to audit (empty = this checkout); the audit itself always comes from this checkout and the tools branch'
        default: ''
      section:
        description: 'Only one section (empty = everything): seasons, extras, fixes (1.5.3: settings and setup on a phone, no Start/Restart while installing, steady quick commands), layers, first, nav, create, maker (Server Maker steps), schedule (Edit schedule reachable, #236), hub (Settings › Browse Hub: list, Install on Hub links, Details on top), inventory (every function, for the 0.7.0 diff), compare (the overview measured, 8 servers) or speed (opening Admin tools timed: server parts, files, legacy panel)'
        default: ''
      from:
        description: 'A Simplify tag (e.g. v1.5.1) installed and seeded first; then the Simplify branch updates it, as on a real panel'
        default: ''
      baseline:
        description: 'With section compare: the Simplify tag the overview is measured against (its own compare run must exist), at most 10% larger'
        default: 'v1.5.5'
      legacy:
        description: 'A branch of PelicanSimplify to install instead of Simplify and the add-ons (with section compare; no longer the baseline)'
        default: ''
      legacy_brand:
        description: 'yes = a PelicanSimplify 0.7.0 appearance.json with a brand block before Simplify installs (its import migration)'
        default: ''
      tools:
        description: 'Branch with the audit scripts, checked out into tests/audit (they are not part of the plugin)'
        default: 'audit-tools'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      parts: ${{ steps.list.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tools || 'audit-tools' }}
          path: tests/audit
      - id: list
        env:
          ONLY: ${{ inputs.only }}
          THEME: ${{ inputs.theme }}
          SCOPE: ${{ inputs.scope }}
          PARTS: ${{ inputs.parts }}
          SECTION: ${{ inputs.section }}
        run: |
          python3 tests/audit/parts.py --self-test
          parts="$PARTS"; skip=no
          if [ -z "$parts" ] && [ "$SCOPE" = changed ] && [ -z "$SECTION" ]; then
            git fetch -q origin main
            if [ "$(git merge-base origin/main HEAD)" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::This checkout is main itself: every part runs"
            else
              files=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
              printf 'Changed since main:\n%s\n' "$files"
              parts=$(printf '%s\n' "$files" | python3 tests/audit/parts.py)
              echo "Parts: ${parts:-none}"
              if [ -z "$parts" ]; then skip=yes; echo "::notice::No changed file is visible in the screen audit; nothing to audit"; elif [ "$parts" = all ]; then parts=''; fi
            fi
          fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          python3 - "$ONLY" "$THEME" "$SECTION" "$skip" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          only, theme, section, skip = sys.argv[1:5]
          stands = only.split(',') if only.strip() else ['d1920', 'd1440', 'laag1366', 'laag1100', 'd1100', 'hoog1280', 'tablet768', 'phone390', 'phone360']
          both = ['d1440', 'phone390'] if section not in ('compare', 'inventory', 'speed') else []
          rows = [{'stand': s, 'theme': t} for s in stands for t in (['dark', 'light'] if s in both else ['dark']) if not theme or t == theme]
          print('matrix=' + json.dumps([] if skip == 'yes' else rows))
          PY
  # One job per stand and theme, side by side; each puts its screens on the branch audit-results, folder <branch>-<stand>
  # (the light job to ...-<stand>-light).
  audit:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: audit (${{ matrix.stand }}, ${{ matrix.theme }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PELICAN: '1.0.0-rc.2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: simplify
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tools || 'audit-tools' }}
          path: simplify/tests/audit
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican
        run: |
          git clone --quiet --depth 1 --branch "v$PELICAN" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '$PELICAN'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=false/; s#^APP_URL=.*#APP_URL=http://127.0.0.1:8001#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=sync\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force --seed
          php artisan storage:link || true
          yarn install --silent
          yarn build
      - name: Install Simplify (this checkout) and the add-ons (main)
        working-directory: panel
        env:
          HOSTING_BRANCH: ${{ inputs.hosting }}
          EXPLAIN_BRANCH: ${{ inputs.explain }}
        run: |
          if [ -n "${{ inputs.legacy }}" ]; then
            git clone --quiet --depth 1 --branch "${{ inputs.legacy }}" https://github.com/jerajerajerajera/PelicanSimplify.git plugins/pelican-simplify
            echo "PelicanSimplify from branch ${{ inputs.legacy }} at $(git -C plugins/pelican-simplify rev-parse --short HEAD)"
            rm -rf plugins/pelican-simplify/.git
            # 0.7.0 sends a root admin to its settings until setup is done; the comparison measures the overview.
            for dir in storage/app/private/simplify storage/app/simplify; do mkdir -p "$dir"; echo '{"setup_completed":true}' > "$dir/features.json"; done
            # 0.7.0 wants a queue that persists and a worker (started with the panel).
            sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=database/' .env && php artisan config:clear
            php artisan p:plugin:install pelican-simplify
            php artisan p:plugin:list
            exit 0
          fi
          mkdir -p plugins/simplify
          if [ -n "${{ inputs.from }}" ]; then
            # The update test: the old version now, the branch after the seed (next step).
            if [ -n "${{ inputs.simplify }}" ]; then git clone --quiet --depth 1 --branch "${{ inputs.simplify }}" https://github.com/jerajerajerajera/Simplify.git ../simplify-next; else tar -C ../simplify --exclude=.git -cf - . | (mkdir -p ../simplify-next && tar -C ../simplify-next -xf -); fi
            git clone --quiet --depth 1 --branch "${{ inputs.from }}" https://github.com/jerajerajerajera/Simplify.git simplify-src
            echo "Simplify ${{ inputs.from }} first, then $(git -C ../simplify-next rev-parse --short HEAD 2>/dev/null || echo this checkout)"
            tar -C simplify-src --exclude=.git --exclude=tests --exclude=.github -cf - . | tar -C plugins/simplify -xf - && rm -rf simplify-src
          elif [ -n "${{ inputs.simplify }}" ]; then
            git clone --quiet --depth 1 --branch "${{ inputs.simplify }}" https://github.com/jerajerajerajera/Simplify.git simplify-src
            echo "Simplify from branch ${{ inputs.simplify }} at $(git -C simplify-src rev-parse --short HEAD)"
            tar -C simplify-src --exclude=.git --exclude=tests --exclude=.github -cf - . | tar -C plugins/simplify -xf - && rm -rf simplify-src
          else
            tar -C ../simplify --exclude=.git --exclude=tests --exclude=.github -cf - . | tar -C plugins/simplify -xf -
          fi
          if [ "${{ inputs.legacy_brand }}" = yes ]; then
            for dir in storage/app/private/simplify storage/app/simplify; do mkdir -p "$dir"; echo '{"brand":{"font":"serif","weight":800,"color_style":"gradient","color1":"#ff7a59","color2":"#8e6bd8","spacing":8,"uppercase":true,"logo_text":true}}' > "$dir/appearance.json"; done
            echo "PelicanSimplify 0.7.0 appearance.json written"
          fi
          php artisan p:plugin:install simplify
          if [ "${{ inputs.legacy_brand }}" = yes ]; then php artisan tinker --execute="echo json_encode(\\DB::table('simplify_settings')->where('key', 'like', 'brand_%')->pluck('value', 'key'));" || true; fi
          for pair in Simplify-Toolkit:simplify-toolkit Simplify-EggUpdates:simplify-eggupdates Simplify-Explain:simplify-explain Simplify-ServerMaker:simplify-servermaker Simplify-Hosting:simplify-hosting; do
            repo=${pair%%:*}; id=${pair##*:}
            if [ "$repo" = Simplify-ServerMaker ] && [ "${{ inputs.servermaker }}" = none ]; then echo "Server Maker left out"; continue; fi
            branch=main; [ "$repo" = Simplify-Toolkit ] && branch="${{ inputs.toolkit || 'main' }}"; [ "$repo" = Simplify-ServerMaker ] && branch="${{ inputs.servermaker || 'main' }}"
            [ "$repo" = Simplify-Hosting ] && branch="${HOSTING_BRANCH:-main}"; [ "$repo" = Simplify-Explain ] && branch="${EXPLAIN_BRANCH:-main}"
            git clone --quiet --depth 1 --branch "$branch" "https://github.com/jerajerajerajera/$repo.git" "plugins/$id"
            real=$(php -r "echo json_decode(file_get_contents('plugins/$id/plugin.json'), true)['id'];")
            if [ "$real" != "$id" ]; then mv "plugins/$id" "plugins/$real"; id=$real; fi
            rm -rf "plugins/$id/.git"
            php artisan p:plugin:install "$id"
          done
          # A plugin that is not Simplify, so Admin tools has an Other plugins group, as on a real panel.
          cp -r ../simplify/tests/audit/fake-plugin plugins/audit-directory && php artisan p:plugin:install audit-directory || echo "audit-directory did not install"
          php artisan p:plugin:list
      - name: Seed and start the panel and the fake Wings
        working-directory: panel
        run: |
          php ../simplify/tests/audit/seed.php 8090 ${{ inputs.section == 'compare' && '8' || '' }} > servers.json
          php ../simplify/tests/audit/urls.php > urls.json || echo "{}" > urls.json
          cat urls.json
          if [ -n "${{ inputs.from }}" ]; then
            # As Admin → Plugins and the Hub update it: the new files over the old, the install in a queue job.
            rm -rf plugins/simplify && mkdir -p plugins/simplify
            tar -C ../simplify-next --exclude=.git --exclude=tests --exclude=.github -cf - . | tar -C plugins/simplify -xf -
            php artisan tinker --execute="App\Jobs\Plugin\InstallPlugin::dispatch(App\Models\User::first(), 'simplify');"
            php artisan queue:work --max-jobs=1 --stop-when-empty
            php artisan p:plugin:list | tee plugins.txt
            grep -E 'Simplify .*\| enabled' plugins.txt || { echo '::error::Simplify did not update'; tail -n 40 storage/logs/*.log || true; exit 1; }
            php artisan migrate:status | grep -i simplify | grep -iv ran && { echo '::error::Simplify migrations left'; exit 1; } || true
            php ../simplify/tests/audit/urls.php > urls.json || true
          fi
          nohup node ../simplify/tests/audit/fake-minecraft.cjs --servers servers.json > minecraft.out 2>&1 &
          nohup node ../simplify/tests/audit/fake-wings.cjs --port 8090 --servers servers.json --log wings.log > wings.out 2>&1 &
          if [ -n "${{ inputs.legacy }}" ]; then nohup php artisan queue:work --sleep=1 > queue.log 2>&1 & fi
          PHP_CLI_SERVER_WORKERS=8 nohup php artisan serve --host 127.0.0.1 --port 8001 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8001/login && break; sleep 1; done
          curl -sS http://127.0.0.1:8090/api/system
      - name: Open every screen
        run: |
          cd simplify/tests/audit
          npm init -y > /dev/null
          npm install --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          if [ "${{ inputs.section }}" = inventory ]; then node inventory.cjs --base http://127.0.0.1:8001 --out ../../../result; exit 0; fi
          if [ "${{ inputs.section }}" = speed ]; then (cd ../../../panel && php ../simplify/tests/audit/speed.php 5 > ../result-server.json) || true; node speed.cjs --base http://127.0.0.1:8001 --out ../../../result; mv ../../../result-server.json ../../../result/server.json || true; cat ../../../result/server.json || true; exit 0; fi
          if [ "${{ inputs.section }}" = compare ]; then node compare.cjs --base http://127.0.0.1:8001 --out ../../../result --only ${{ matrix.stand }}; exit 0; fi
          node audit.cjs --base http://127.0.0.1:8001 --urls ../../../panel/urls.json --out ../../../result --only ${{ matrix.stand }} --theme "${{ matrix.theme }}" --parts "${{ needs.plan.outputs.parts }}" --section "${{ inputs.section }}" --servermaker "${{ inputs.servermaker }}"
      - if: always()
        name: Logs
        run: |
          tail -n 40 panel/wings.log || true
          grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 30 || true
      - name: Style verdict (fails the job when a UI rule is broken)
        if: inputs.section != 'compare' && inputs.section != 'inventory' && inputs.section != 'speed'
        id: style
        continue-on-error: true
        run: set -o pipefail; python3 simplify/tests/audit/style-report.py result/result.json | tee result/style.md
      - name: Compare verdict (section compare, against the baseline's own compare run)
        if: inputs.section == 'compare' && !inputs.legacy && inputs.simplify != inputs.baseline
        id: compare
        continue-on-error: true
        run: |
          set -o pipefail
          base="$(echo "${{ inputs.baseline }}" | tr "/" "-")-compare-${{ matrix.stand }}"
          git -C simplify fetch -q --depth 1 origin "+refs/heads/audit-results:baseline" && git -C simplify show "baseline:$base/compare.json" > baseline.json || { echo "::error::No compare run of ${{ inputs.baseline }} for ${{ matrix.stand }}: run this workflow with section compare and simplify ${{ inputs.baseline }} first"; exit 1; }
          python3 simplify/tests/audit/compare-verdict.py baseline.json result/compare.json | tee result/compare.md
      - if: always()
        name: Result to the audit-results branch
        # One branch for every result, a folder per branch and stand; see tests/audit/publish.sh.
        run: bash simplify/tests/audit/publish.sh "$(echo "${{ inputs.legacy && format('legacy-{0}', inputs.legacy) || inputs.simplify || github.ref_name }}" | tr "/" "-")${{ inputs.from && format('-from-{0}', inputs.from) || '' }}${{ (inputs.section == 'compare' || inputs.section == 'inventory' || inputs.section == 'speed') && format('-{0}', inputs.section) || '' }}${{ inputs.servermaker == 'none' && '-nosm' || '' }}-${{ matrix.stand }}${{ matrix.theme == 'light' && '-light' || '' }}" result "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - name: Fail when the compare verdict is red
        if: steps.compare.outcome == 'failure'
        run: |
          echo "::error::The overview is more than 10% larger than ${{ inputs.baseline }}, see compare.md on the results branch"
          exit 1
      - name: Fail when the style verdict is red
        if: steps.style.outcome == 'failure'
        run: |
          echo "::error::UI rules broken, see style.md on the results branch"
          exit 1
