name: Checks
on:
  push:
    branches: [main]
  pull_request: {}
  # The update from PelicanSimplify 0.7.0 (and pelican-simplify 1.3.11, Simplify 1.4.4) runs by hand only, once
  # before the 2.0 release; every other run updates from 1.5.5, the base since 2 November 2026.
  workflow_dispatch:
    inputs:
      from070:
        description: 'Update from PelicanSimplify 0.7.0 files, pelican-simplify 1.3.11 and Simplify 1.4.4 instead of 1.5.5'
        type: boolean
        default: false
jobs:
  # A change to text only (docs, Markdown) skips the panel: tests and pint still run, so the check stays green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="origin/${{ github.base_ref }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files=$(git diff --name-only "$base" HEAD 2>/dev/null) || files=unknown
          printf 'Changed:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '^(docs/|LICENSE|.*\.md$)'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "::notice::Text only: the panel smoke is skipped"; fi
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: bash tests/run.sh
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pint
      - run: pint --test -v
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes eslint@9 'resources/**/*.js'
  # Installs the plugin in a real Pelican panel and opens its pages, so an error that only shows when the panel loads the code blocks the merge.
  panel-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pelican: '1.0.0-beta38'
            php: '8.3'
          - pelican: '1.0.0-rc.2'
            php: '8.4'
    name: panel-smoke (Pelican ${{ matrix.pelican }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican ${{ matrix.pelican }}
        run: |
          git clone --quiet --depth 1 --branch "v${{ matrix.pelican }}" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '${{ matrix.pelican }}'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s#^APP_URL=.*#APP_URL=http://localhost#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=database\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          yarn install --silent
      # Until 1.4.0 the plugin id was pelican-simplify, the id of the old PelicanSimplify too: install 1.3.11 first and
      # leave PelicanSimplify 0.7.0's files in storage, so the job proves the new id takes over both.
      - name: Install the old pelican-simplify 1.3.11 and PelicanSimplify's files
        if: inputs.from070
        run: |
          git clone --quiet --depth 1 --branch v1.3.11 "https://github.com/${{ github.repository }}.git" panel/plugins/pelican-simplify
          rm -rf panel/plugins/pelican-simplify/.git
          cd panel
          # 0.7.0's subdomains were there before Simplify came: the addresses in storage, the Cloudflare token and zone
          # ID in .env. Written before the first install, which is when Simplify takes the addresses over.
          mkdir -p storage/app/private/simplify storage/app/simplify
          for d in storage/app/private storage/app; do echo '{"domain":"example.com","target":"play.example.com","port_min":25565,"port_max":25600}' > $d/simplify/subdomains.json; done
          printf 'CLOUDFLARE_API_TOKEN=upgrade-token\nCLOUDFLARE_ZONE_ID=%s\n' "$(printf 'a%.0s' $(seq 32))" >> .env
          php artisan p:plugin:install pelican-simplify
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $db->prepare("INSERT INTO simplify_settings (key, value) VALUES (?, ?)")->execute(["support_url", json_encode("https://example.com/kept")]);'
          mkdir -p storage/app/private/simplify storage/app/simplify
          for d in storage/app/private storage/app; do
            echo '[{"id":"0123456789abcdef","category":"warning","title":"Old announcement","text":"From 0.7.0","audience":"everyone","button":{"label":"Read","url":"https://example.com"},"created_at":1761696000,"updated_at":1761696000,"push":true,"pushed_at":1761696000,"pinned":true,"ingame":{"enabled":true,"targets":"all","servers":[],"repeat":30}}]' > $d/simplify/announcements.json
            echo '{"accent_color":"#e11d48","brand":{"mode":"text","text":"Old panel","font":"rounded","weight":800,"color_style":"gradient","color1":"#ff0000","color2":"","spacing":2,"uppercase":false,"suffix":false,"logo":null,"logo_height":32,"logo_text":true}}' > $d/simplify/appearance.json
            echo '{"style":"dark","corners":"square","players":false}' > $d/simplify/website-embed.json
          done
      # The way most panels update: 1.4.4 first, with PelicanSimplify's files still there, then this version over it.
      - name: Install Simplify 1.4.4
        if: inputs.from070
        run: |
          git clone --quiet --depth 1 --branch v1.4.4 "https://github.com/${{ github.repository }}.git" panel/plugins/simplify
          rm -rf panel/plugins/simplify/.git
          cd panel
          php artisan p:plugin:install simplify
          rm -rf plugins/simplify
      # The way panels update now: 1.5.5 with every setting filled in, then this version over it.
      - name: Install Simplify 1.5.5 with its settings filled in
        if: ${{ !inputs.from070 }}
        run: |
          git clone --quiet --depth 1 --branch v1.5.5 "https://github.com/${{ github.repository }}.git" panel/plugins/simplify
          rm -rf panel/plugins/simplify/.git
          cd panel
          php artisan p:plugin:install simplify
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $set = $db->prepare("INSERT OR REPLACE INTO simplify_settings (key, value) VALUES (?, ?)"); foreach (["support_url" => "https://example.com/kept", "accent" => "#e11d48", "brand_name" => "Old panel", "brand_font" => "rounded", "brand_colour" => "gradient", "brand_show" => "both", "pelican_suffix" => false] as $k => $v) { $set->execute([$k, json_encode($v)]); } $db->prepare("INSERT INTO simplify_core_announcements (category, title, body, audience, in_bell, bell_pinned, push, in_game, in_game_repeat, created_at, updated_at) VALUES (?, ?, ?, ?, 1, 1, 0, 1, 30, ?, ?)")->execute(["warning", "Old announcement", "From 1.5.5", "everyone", "2026-11-02 12:00:00", "2026-11-02 12:00:00"]); $db->prepare("INSERT OR REPLACE INTO simplify_core_embed_settings (key, value) VALUES (?, ?)")->execute(["style", json_encode("dark")]);'
          rm -rf plugins/simplify
      - name: Install Simplify
        run: |
          mkdir -p panel/plugins/simplify
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify -xf -
          cd panel
          # As Admin → Plugins and the Hub install it: in a queue job.
          php artisan tinker --execute="App\Jobs\Plugin\InstallPlugin::dispatch(App\Models\User::factory()->create(), 'simplify');"
          php artisan queue:work --max-jobs=1 --stop-when-empty
          php artisan p:plugin:list | tee plugins.txt
          grep -E 'Simplify .*\| enabled' plugins.txt || { echo 'Simplify did not install'; exit 1; }
          test ! -e plugins/pelican-simplify || { echo 'The old pelican-simplify folder is still there'; exit 1; }
          test "$(grep -c '| Simplify ' plugins.txt)" = 1 || { echo 'Simplify is listed twice'; exit 1; }
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $v = fn ($k) => json_decode((string) $db->query("SELECT value FROM simplify_settings WHERE key = \"$k\"")->fetchColumn()); $a = $db->query("SELECT title, in_bell, push, in_game, in_game_repeat FROM simplify_core_announcements")->fetchAll(PDO::FETCH_ASSOC); $e = $db->query("SELECT value FROM simplify_core_embed_settings WHERE key = \"style\"")->fetchColumn(); echo json_encode([$v("support_url"), $v("accent"), $v("brand_name"), $v("brand_font"), $v("brand_show"), $v("pelican_suffix"), $a, $e]), PHP_EOL; exit($v("support_url") === "https://example.com/kept" && $v("pelican_suffix") === false && $v("accent") === "#e11d48" && $v("brand_name") === "Old panel" && $v("brand_font") === "rounded" && $v("brand_colour") === "gradient" && $v("brand_show") === "both" && count($a) === 1 && $a[0]["title"] === "Old announcement" && (int) $a[0]["in_bell"] === 1 && (int) $a[0]["push"] === 0 && (int) $a[0]["in_game_repeat"] === 30 && $e === "\"dark\"" ? 0 : 1);' || { echo 'The old settings were not kept or not imported'; exit 1; }
      - name: Check that 0.7.0's subdomain setup was taken over
        if: inputs.from070
        working-directory: panel
        run: |
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $v = fn ($k) => (string) $db->query("SELECT value FROM simplify_core_subdomain_settings WHERE key = \"$k\"")->fetchColumn(); $ran = $db->query("SELECT migration FROM migrations WHERE migration LIKE \"%subdomains%\"")->fetchAll(PDO::FETCH_COLUMN); echo json_encode(["migrations" => $ran, "domain" => $v("domain"), "zone_id" => strlen($v("zone_id")), "token" => $v("token") === "" ? "missing" : "present"]), PHP_EOL; exit($v("domain") === "example.com" && $v("zone_id") === str_repeat("a", 32) && $v("token") !== "" && ! str_contains($v("token"), "upgrade-token") ? 0 : 1);' || { echo 'The Cloudflare token and zone ID from .env were not taken over'; exit 1; }
      - name: Install Simplify over its own tables
        # An install that stopped halfway leaves tables without their migration rows; the next install keeps them.
        working-directory: panel
        run: |
          php artisan tinker --execute="DB::table('migrations')->where('migration', 'like', '%simplify%')->delete();"
          php artisan tinker --execute="app('migrator')->run(base_path('plugins/simplify/database/migrations')); echo 'ran '.DB::table('migrations')->where('migration', 'like', '%simplify%')->count();" | tee again.txt
          grep -qx "ran $(ls plugins/simplify/database/migrations | wc -l)" again.txt || { echo 'Simplify did not install over its own tables'; exit 1; }
      - name: Uninstall Simplify and install it again
        # Uninstalling keeps the data (every down() is empty): installing again finds the settings as they were. Pelican
        # must still start without Simplify.
        working-directory: panel
        run: |
          cp -r plugins/simplify ../simplify-copy
          php artisan p:plugin:uninstall simplify --no-interaction
          php artisan p:plugin:list | tee uninstalled.txt
          ! grep -E 'Simplify .*\| enabled' uninstalled.txt || { echo 'Simplify is still enabled after uninstall'; exit 1; }
          php artisan about > /dev/null || { echo 'Pelican does not start after Simplify was uninstalled'; exit 1; }
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $v = $db->query("SELECT value FROM simplify_settings WHERE key = \"support_url\"")->fetchColumn(); exit($v === json_encode("https://example.com/kept") ? 0 : 1);' || { echo 'Uninstalling removed the settings'; exit 1; }
          test -d plugins/simplify || cp -r ../simplify-copy plugins/simplify
          php artisan p:plugin:install simplify --no-interaction
          php artisan p:plugin:list | tee reinstalled.txt
          grep -E 'Simplify .*\| enabled' reinstalled.txt || { echo 'Simplify did not install again'; exit 1; }
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $v = $db->query("SELECT value FROM simplify_settings WHERE key = \"support_url\"")->fetchColumn(); $a = (int) $db->query("SELECT count(*) FROM simplify_core_announcements WHERE title = \"Old announcement\"")->fetchColumn(); echo json_encode([$v, $a]), PHP_EOL; exit($v === json_encode("https://example.com/kept") && $a === 1 ? 0 : 1);' || { echo 'The settings did not come back after installing again'; exit 1; }
      - name: Open the pages
        working-directory: panel
        # The last line must say so: an exit code alone missed a crash before the first step once.
        run: |
          php plugins/simplify/tests/panel/smoke.php | tee smoke.txt
          tail -n 1 smoke.txt | grep -qx 'All steps passed'
      - name: PHPStan (level 5, in the panel)
        if: matrix.pelican == '1.0.0-rc.2' # the baseline fits one Pelican version, the newest: types differ between versions
        working-directory: panel
        # After the smoke: installing larastan brings PHPUnit into the panel, which changes how Livewire's test helpers behave.
        run: |
          composer require --dev larastan/larastan --no-interaction --no-progress --quiet
          # Without a baseline yet: the first run writes one and prints it, to commit as the starting point (every
          # finding in it is on the clean-up list; new code must be clean).
          if [ -f plugins/simplify/phpstan-baseline.neon ]; then
            vendor/bin/phpstan analyse --configuration plugins/simplify/phpstan.neon --memory-limit 1G --no-progress --error-format=github
          else
            vendor/bin/phpstan analyse --configuration plugins/simplify/phpstan.neon --memory-limit 1G --no-progress --generate-baseline=plugins/simplify/phpstan-baseline.neon --allow-empty-baseline
            echo '::group::phpstan-baseline.neon'; cat plugins/simplify/phpstan-baseline.neon; echo '::endgroup::'
          fi
      - name: Laravel log
        if: failure()
        run: grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
  # A real browser on a seeded panel (the audit's seed, urls and fake Wings from the branch audit-tools): the overview, a
  # server's console, a menu click, Admin and Settings on a desktop and a phone, with axe-core and Lighthouse. Only when
  # something the browser can see changed. The first run is the baseline for tests/panel/budgets.json.
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PELICAN: '1.0.0-rc.2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: simplify
      - uses: actions/checkout@v4
        with:
          ref: audit-tools
          path: simplify/tests/audit
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican and Simplify
        run: |
          git clone --quiet --depth 1 --branch "v$PELICAN" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '$PELICAN'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=false/; s#^APP_URL=.*#APP_URL=http://127.0.0.1:8001#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=sync\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force --seed
          php artisan storage:link || true
          yarn install --silent
          yarn build
          mkdir -p plugins/simplify
          tar -C ../simplify --exclude=.git --exclude=tests --exclude=.github -cf - . | tar -C plugins/simplify -xf -
          php artisan p:plugin:install simplify
          php artisan p:plugin:list
      - name: Seed and start the panel and the fake Wings
        working-directory: panel
        run: |
          php ../simplify/tests/audit/seed.php 8090 > servers.json
          php ../simplify/tests/audit/urls.php > urls.json
          nohup node ../simplify/tests/audit/fake-wings.cjs --port 8090 --servers servers.json --log wings.log > wings.out 2>&1 &
          PHP_CLI_SERVER_WORKERS=8 nohup php artisan serve --host 127.0.0.1 --port 8001 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8001/login && break; sleep 1; done
      - name: Open the screens in a browser
        working-directory: simplify
        run: |
          mkdir -p ../result
          npm init -y > /dev/null
          npm install --silent playwright@1.48.2 axe-core@4.10.2 lighthouse@12.2.1
          npx playwright install --with-deps chromium > /dev/null
          node tests/panel/browser.cjs --base http://127.0.0.1:8001 --urls ../panel/urls.json --out ../result | tee ../result/browser.txt
          tail -n 1 ../result/browser.txt | grep -qx 'All steps passed'
      - name: Lighthouse
        working-directory: simplify
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          server="$(node -e "console.log(JSON.parse(require('fs').readFileSync('../panel/urls.json','utf8')).servers['Survival SMP'] || '')")"
          for pair in "overview:/" "server:$server" "admin:/admin"; do
            name=${pair%%:*}; url=${pair#*:}; [ -n "$url" ] || continue
            case "$url" in http*) ;; *) url="http://127.0.0.1:8001$url";; esac # the seed's server URL is already absolute
            npx lighthouse "$url" --chrome-flags="--headless=new --no-sandbox" --extra-headers "$(cat ../result/headers.json)" \
              --only-categories=performance,accessibility,best-practices --output json --output html --output-path "../result/lh-$name" --quiet || true
          done
          node tests/panel/lighthouse.cjs --out ../result
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: result
          retention-days: 14
      - if: failure()
        name: Logs
        run: |
          tail -n 20 panel/serve.log panel/wings.log || true
          grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
