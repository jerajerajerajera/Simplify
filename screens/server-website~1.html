<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pelican servers</title><style>html,body{margin:0}html,body{background:transparent}body{padding:2px}</style></head><body><div id="simplify-servers" data-simplify-embed="1"></div><script>(()=>{const top_=window.top;const theme=(d)=>{document.documentElement.classList.toggle('dark',d);document.querySelectorAll('.ps,.ps-ui').forEach(e=>e.classList.toggle('dark',d));document.querySelectorAll('iframe').forEach(f=>{try{f.contentWindow.postMessage({demo:'theme',dark:d},'*')}catch(e){}})};addEventListener('message',e=>{if(e.data&&e.data.demo==='theme')theme(e.data.dark)});document.addEventListener('click',e=>{const go=e.target.closest('[data-demo-go]');if(go){e.preventDefault();e.stopPropagation();top_.postMessage({demo:'go',id:go.getAttribute('data-demo-go')},'*');return}const a=e.target.closest('a,button,[role=tab],[role=button],input[type=submit]');if(!a)return;if(a.matches('a[target=_blank]')&&/^https?:/.test(a.getAttribute('data-demo-url')||'')&&!a.hasAttribute('data-demo-inside')){e.preventDefault();open(a.getAttribute('data-demo-url'),'_blank','noopener');return}e.preventDefault();e.stopPropagation();top_.postMessage({demo:'dead',label:(a.innerText||a.getAttribute('aria-label')||a.getAttribute('data-tip')||'').trim().replace(/\s+/g,' ').slice(0,60)},'*')},true);document.addEventListener('submit',e=>e.preventDefault(),true);top_.postMessage({demo:'ready'},'*')})();</script></body></html>
